name: Check for new publications

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.changes.outputs.found }}
    steps:
      - name: Open the repository
        uses: actions/checkout@v4

      - name: Check confirmed researchers
        run: python scripts/check_publications.py

      - name: Detect new publications
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- publications.json; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save proposed publications
        if: steps.changes.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proposed-publications
          path: publications.json
          retention-days: 7

  approve:
    needs: discover
    if: needs.discover.outputs.found == 'true'
    runs-on: ubuntu-latest
    environment: publication-approval
    steps:
      - name: Open the repository
        uses: actions/checkout@v4

      - name: Retrieve approved publications
        uses: actions/download-artifact@v4
        with:
          name: proposed-publications
          path: .

      - name: Publish approved records
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git commit -m "Add approved publication discoveries"
          git push

